name: Build Android APK (from zip)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q launcherreplit.zip
          ls Android-launcher

      - name: Complete the local launcher module's build.gradle
        run: |
          cat >> Android-launcher/artifacts/swift-launcher/modules/swift-launcher/android/build.gradle << 'GRADLE'

          android {
            namespace 'expo.modules.swiftlauncher'
            defaultConfig {
              versionCode 1
              versionName '1.0.0'
            }
          }

          expoModule {
            canBePublished false
          }
          GRADLE
          tail -15 Android-launcher/artifacts/swift-launcher/modules/swift-launcher/android/build.gradle

      - name: Fix Kotlin return-type errors in SwiftLauncherModule.kt
        run: |
          F=Android-launcher/artifacts/swift-launcher/modules/swift-launcher/android/src/main/java/expo/modules/swiftlauncher/SwiftLauncherModule.kt
          perl -0pi -e 's/val context = appContext\.reactContext \?: return\@AsyncFunction\n\s*context\.startActivity\(\n/appContext.reactContext?.startActivity(\n/g' "$F"
          grep -n "reactContext?.startActivity" "$F"

      - name: Fix remaining zero-argument AsyncFunction early returns
        run: |
          python3 - << 'PY'
          import re
          p = "Android-launcher/artifacts/swift-launcher/modules/swift-launcher/android/src/main/java/expo/modules/swiftlauncher/SwiftLauncherModule.kt"
          s = open(p).read()
          def fix(m):
              return re.sub(r"return@AsyncFunction(?=[ \t]*\n)", "return@AsyncFunction null", m.group(0))
          s = re.sub(r'AsyncFunction\("[^"]*"\) \{\n.*?\n    \}\n', fix, s, flags=re.S)
          open(p, "w").write(s)
          PY
          grep -n "return@AsyncFunction null" Android-launcher/artifacts/swift-launcher/modules/swift-launcher/android/src/main/java/expo/modules/swiftlauncher/SwiftLauncherModule.kt

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Android-launcher/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies (workspace root)
        working-directory: Android-launcher
        run: pnpm install --frozen-lockfile

      - name: Make @expo/config-plugins resolvable from the app (pnpm strict layout)
        working-directory: Android-launcher/artifacts/swift-launcher
        run: |
          mkdir -p node_modules/@expo
          target=$(ls -d ../../node_modules/.pnpm/@expo+config-plugins@*/node_modules/@expo/config-plugins | head -1)
          ln -sfn "$(realpath "$target")" node_modules/@expo/config-plugins
          node -e "console.log('resolved:', require.resolve('@expo/config-plugins'))"

      - name: Generate native Android project
        working-directory: Android-launcher/artifacts/swift-launcher
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: Android-launcher/artifacts/swift-launcher/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swift-launcher-apk
          path: Android-launcher/artifacts/swift-launcher/android/app/build/outputs/apk/release/*.apk
